<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f7f6;font-family:Arial,sans-serif;color:#17201d">
    <div style="max-width:520px;margin:40px auto;padding:32px;background:#ffffff;border:1px solid #e4e9e5;border-radius:20px">
      <p style="margin:0 0 24px;color:#0b5d3b;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Easy Ride</p>
      <h1 style="margin:0 0 12px;font-size:24px">Verify your email</h1>
      <p style="margin:0 0 24px;color:#5f6d65;line-height:1.6">Enter this six-digit code in Easy Ride to finish creating your account. It expires in five minutes.</p>
      <p style="margin:0;padding:18px;background:#f1f6f2;border-radius:12px;text-align:center;color:#0b5d3b;font-size:32px;font-weight:700;letter-spacing:10px">{{ .Token }}</p>
      <p style="margin:24px 0 0;color:#7b8580;font-size:12px;line-height:1.5">If you did not request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
